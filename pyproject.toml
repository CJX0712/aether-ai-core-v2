[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-ai-core"
version = "1.0.0"
description = "端到端模块化 AI 系统：接口驱动、可插拔、可一键复现"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["ai", "rag", "agent", "llm", "modular"]
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
world-class = [
    "sentence-transformers>=2.6",
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
    "ctransformers>=0.2.27",
    "pypdf>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
aether = "aether.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
