services:
  aether:
    build: .
    image: aether-ai-core:1.0.0
    container_name: aether-ai-core
    ports:
      - "8000:8000"
    environment:
      AETHER_LLM_BACKEND: "mock"
      AETHER_EMBEDDING_BACKEND: "tfidf"
      AETHER_VECTORSTORE_BACKEND: "memory"
      AETHER_SERVER_PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
